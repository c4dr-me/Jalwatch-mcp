[project]
name = "jalwatch"
version = "0.1.0"
description = "Evidence-based water-risk monitoring decision support for India."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "httpx>=0.28.1",
    "langchain>=1,<2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langfuse>=4.7,<5",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
